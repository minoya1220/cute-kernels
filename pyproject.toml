[project]
name = "cute-kernels"
version = "0.1.0"
description = "A repo of kernels ive written in CuTe DSL."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "nvidia-cutlass-dsl>=4.3.5",
    "nvidia-ml-py>=13.610.43",
    "torch>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cute-kernels", "softmax"]
py-modules = ["measure", "utils"]